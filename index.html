<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#001b35">
    <title>Sheets Editor</title>
    <style>
        @font-face {
            font-family: 'Apercu Regular Pro';
            src: url('apercu_regular_pro.otf') format('opentype'),
                 url('https://spirttomb.github.io/Lineup-Generator/apercu_regular_pro.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --navy-950: #001b35;
            --navy-900: #002a4f;
            --navy-800: #003d73;
            --navy-700: #044e8f;
            --gold: #f59e0b;
            --gold-hi: #fbbf24;
            --gold-soft: #fef3c7;
            --ink: #1e293b;
            --muted: #5C768D;
            --line: #e1e8f0;
            --line-strong: #c7d3e0;
            --surface: #ffffff;
            --canvas: #edf1f6;
            --tint: #f5f8fb;
            --radius: 18px;
            --shadow-sm: 0 1px 2px rgba(0, 27, 53, 0.06), 0 2px 6px rgba(0, 27, 53, 0.06);
            --shadow-md: 0 12px 32px -12px rgba(0, 27, 53, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Apercu Regular Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--canvas); color: var(--ink); min-height: 100vh;
            -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }
        body.has-savebar { padding-bottom: 5.5rem; }
        input, select, textarea, button { font-family: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        svg { flex-shrink: 0; }

        /* ---------- App bar ---------- */
        .appbar { background: var(--navy-950); color: #fff; position: sticky; top: 0; z-index: 60; }
        .appbar-inner { max-width: 1100px; margin: 0 auto; padding: 0.65rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
        .brand { display: flex; align-items: center; gap: 0.7rem; color: #fff; text-decoration: none; }
        .brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--gold); color: var(--navy-950); display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
        .brand-name { font-weight: 800; font-size: 1.08rem; letter-spacing: -0.01em; line-height: 1; }
        .brand-name small { display: block; font-weight: 600; font-size: 0.66rem; color: #8ea6bf; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 0.25rem; }
        .appbar-actions { margin-left: auto; display: flex; align-items: center; gap: 0.3rem; }
        .icon-btn { width: 40px; height: 40px; border-radius: 11px; border: none; background: transparent; color: #c6d5e4; display: grid; place-items: center; cursor: pointer; text-decoration: none; }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .who { display: none; align-items: center; gap: 0.5rem; color: #c6d5e4; font-size: 0.88rem; font-weight: 700; margin-right: 0.2rem; }
        .who.on { display: flex; }
        .who .chip-avatar { width: 28px; height: 28px; font-size: 0.7rem; }

        /* ---------- Hero ---------- */
        .hero {
            background: radial-gradient(1200px 300px at 85% -40%, rgba(245, 158, 11, 0.16), transparent 60%), linear-gradient(180deg, var(--navy-800), var(--navy-900));
            color: #fff; padding: 1.6rem 1.5rem 4.6rem;
        }
        .hero-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: flex-end; gap: 1rem; }
        .back-btn { width: 42px; height: 42px; border-radius: 12px; border: none; background: rgba(255, 255, 255, 0.1); color: #fff; display: none; place-items: center; cursor: pointer; flex-shrink: 0; margin-bottom: 0.1rem; }
        .back-btn.on { display: grid; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.18); }
        .eyebrow { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-hi); }
        .hero h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.3rem; line-height: 1.1; }
        .hero-sub { color: #aebfd1; font-size: 0.92rem; margin-top: 0.4rem; }

        .workspace { max-width: 1100px; margin: -3.25rem auto 0; padding: 0 1.5rem 3rem; position: relative; }

        /* ---------- Cards ---------- */
        .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 1.25rem; }
        .card-head { display: flex; align-items: center; gap: 0.8rem; padding: 1.15rem 1.3rem 0.35rem; flex-wrap: wrap; }
        .card-head .push { margin-left: auto; }
        .card-head > div { min-width: 0; }
        .card-title { font-size: 1.08rem; font-weight: 800; color: var(--navy-900); letter-spacing: -0.01em; }
        .card-sub { color: var(--muted); font-size: 0.84rem; margin-top: 0.1rem; }
        .card-body { padding: 0.85rem 1.3rem 1.3rem; }
        .count-pill { background: var(--gold-soft); color: #92400e; font-weight: 800; font-size: 0.78rem; padding: 0.3rem 0.7rem; border-radius: 999px; white-space: nowrap; }
        .tile { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
        .tile.staff { background: #fef3c7; color: #a16207; }
        .tile.check { background: #dbeafe; color: #1d4ed8; }
        .tile.rules { background: #ede9fe; color: #6d28d9; }

        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; align-items: start; }
        .home-grid .card { margin-bottom: 0; }
        .home-grid .wide { grid-column: 1 / -1; }
        .area-group { margin-top: 0.9rem; }
        .area-group:first-child { margin-top: 0.1rem; }
        .group-label { font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--navy-800); margin-bottom: 0.45rem; }
        .area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0.5rem; }
        .area-btn {
            display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; text-align: left;
            background: var(--tint); border: 1.5px solid var(--line); border-radius: 12px; padding: 0.7rem 0.85rem;
            font-weight: 700; font-size: 0.95rem; color: var(--navy-900); cursor: pointer;
        }
        .area-btn:hover { border-color: var(--gold); background: #fff; }
        .area-btn svg { color: var(--muted); }
        .note { color: var(--muted); font-size: 0.83rem; line-height: 1.45; }

        /* ---------- Fields ---------- */
        .field, .sel {
            width: 100%; background: var(--tint); border: 1.5px solid var(--line); border-radius: 12px;
            padding: 0.65rem 0.8rem; font-size: 0.98rem; color: var(--ink); transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .sel { padding-right: 0.4rem; }
        textarea.field { resize: none; overflow: hidden; min-height: 2.6rem; line-height: 1.35; }
        .field:focus, .sel:focus { outline: none; border-color: var(--gold); background: #fff; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18); }
        .field.bad { border-color: #ef4444; background: #fef2f2; }
        .lbl { display: block; font-size: 0.78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 0.3rem; }
        .search-field { position: relative; flex: 1; min-width: 12rem; }
        .search-field svg { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
        .search-field .field { padding-left: 2.5rem; }

        .seg { display: inline-flex; background: var(--canvas); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
        .seg button { border: none; background: transparent; padding: 0.45rem 0.8rem; border-radius: 9px; font-weight: 700; font-size: 0.87rem; color: var(--muted); cursor: pointer; }
        .seg button:hover { color: var(--navy-900); }
        .seg button.on { background: #fff; color: var(--navy-900); box-shadow: var(--shadow-sm); }

        /* ---------- Buttons ---------- */
        .btn-primary {
            background: var(--gold); color: var(--navy-950); border: none; border-radius: 12px; padding: 0.75rem 1.2rem;
            font-weight: 800; font-size: 0.98rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            box-shadow: 0 8px 18px -8px rgba(245, 158, 11, 0.8);
        }
        .btn-primary:hover { background: var(--gold-hi); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        .btn-primary.block { width: 100%; }
        .btn-secondary, .btn-dark {
            border-radius: 11px; padding: 0.6rem 0.95rem; font-weight: 700; font-size: 0.9rem; cursor: pointer;
            display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap;
        }
        .btn-secondary { background: #fff; border: 1.5px solid var(--line-strong); color: var(--navy-900); }
        .btn-secondary:hover { border-color: var(--navy-800); }
        .btn-secondary.on { background: var(--navy-900); border-color: var(--navy-900); color: var(--gold-hi); }
        .btn-secondary:disabled { opacity: 0.45; cursor: default; }
        .btn-dark { background: var(--navy-900); border: 1.5px solid var(--navy-900); color: #fff; }
        .btn-dark:hover { background: var(--navy-700); }
        .link-btn { background: none; border: none; color: var(--navy-700); font-weight: 700; font-size: 0.87rem; cursor: pointer; padding: 0.35rem 0.15rem; }
        .link-btn:hover { text-decoration: underline; }
        .link-btn.danger { color: #dc2626; }
        .icon-x { border: none; background: transparent; width: 34px; height: 34px; border-radius: 9px; cursor: pointer; color: var(--muted); display: grid; place-items: center; flex-shrink: 0; }
        .icon-x:hover { background: #fee2e2; color: #dc2626; }
        .add-dashed { width: 100%; border: 1.5px dashed var(--line-strong); background: transparent; color: var(--navy-700); border-radius: 12px; padding: 0.75rem; font-weight: 800; cursor: pointer; font-size: 0.95rem; }
        .add-dashed:hover { border-color: var(--gold); background: var(--gold-soft); color: #78350f; }
        .add-dashed.small { width: auto; padding: 0.45rem 0.8rem; font-size: 0.85rem; }

        .toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; padding: 0.4rem 1.3rem 0.9rem; }

        /* ---------- Staff ---------- */
        .people { border-top: 1px solid var(--line); }
        .person { border-bottom: 1px solid var(--line); }
        .person:last-child { border-bottom: none; }
        .p-head {
            width: 100%; display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1.3rem; background: none; border: none;
            text-align: left; cursor: pointer; color: var(--ink);
        }
        .p-head:hover { background: var(--tint); }
        .person.open > .p-head { background: var(--tint); }
        .chip-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--navy-900); color: var(--gold-hi); display: grid; place-items: center; font-size: 0.75rem; font-weight: 800; flex-shrink: 0; }
        .person.leader .chip-avatar { background: var(--gold); color: var(--navy-950); }
        .p-name { font-weight: 800; color: var(--navy-900); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-name.empty { color: #b91c1c; font-style: italic; font-weight: 600; }
        .tag { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.18rem 0.45rem; border-radius: 6px; white-space: nowrap; }
        .tag.leader { background: var(--gold-soft); color: #92400e; }
        .tag.boh { background: #e2e8f0; color: #334155; }
        .tag.new { background: #dcfce7; color: #166534; }
        .tag.edit { background: #dbeafe; color: #1e40af; }
        .tag.bad { background: #fee2e2; color: #b91c1c; }
        .p-pin { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; color: var(--muted); font-size: 0.9rem; min-width: 3.4rem; text-align: right; }
        .chev { color: var(--muted); transition: transform 0.2s; }
        .person.open .chev { transform: rotate(180deg); }
        .p-form { padding: 0.4rem 1.3rem 1.2rem; background: var(--tint); }
        .p-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 0.75rem; }
        .p-row { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-top: 0.9rem; }
        .p-row > div { min-width: 0; }
        .p-form .field, .p-form .sel { background: #fff; }
        .hint-line { font-size: 0.8rem; color: #b45309; font-weight: 700; margin-top: 0.3rem; }
        .err-line { font-size: 0.85rem; color: #b91c1c; font-weight: 700; margin-top: 0.7rem; padding: 0.45rem 0.65rem; border-radius: 8px; background: #fef2f2; }
        .ratings { margin-top: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 0.35rem 1.5rem; }
        .rate-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
        .rate-row span { font-weight: 700; font-size: 0.9rem; color: var(--navy-900); }
        .rate { display: inline-flex; gap: 3px; }
        .rate button { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; font-weight: 800; color: var(--muted); cursor: pointer; font-size: 0.88rem; }
        .rate button:hover { border-color: var(--line-strong); }
        .rate button.on.r0 { background: var(--canvas); border-color: var(--line-strong); color: var(--muted); }
        .rate button.on.r1 { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
        .rate button.on.r2 { background: #ffedd5; border-color: #fdba74; color: #c2410c; }
        .rate button.on.r3 { background: #e2e8f0; border-color: #94a3b8; color: #334155; }
        .rate button.on.r4 { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
        .rate button.on.r5 { background: #dcfce7; border-color: #86efac; color: #15803d; }
        .p-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; gap: 0.5rem; flex-wrap: wrap; }
        .sub-title { font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 1.1rem; }
        .empty-note { padding: 2rem 1.3rem; text-align: center; color: var(--muted); }

        /* ---------- Checklist ---------- */
        .ck-tabs { padding: 0.3rem 1.3rem 0.2rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
        .ck-hint { color: var(--muted); font-size: 0.84rem; padding: 0.35rem 1.3rem 0; }
        .task { border: 1px solid var(--line); border-radius: 14px; padding: 0.7rem; margin-bottom: 0.75rem; background: #fff; }
        .task-head, .step { display: flex; align-items: flex-start; gap: 0.45rem; }
        .task-num { width: 26px; height: 26px; border-radius: 8px; background: var(--navy-900); color: var(--gold-hi); display: grid; place-items: center; font-size: 0.78rem; font-weight: 800; flex-shrink: 0; margin-top: 0.45rem; }
        .task-head .field { font-weight: 800; }
        .steps { margin: 0.55rem 0 0.1rem 2.2rem; }
        .step { margin-bottom: 0.4rem; background: #fff; }
        .step-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); margin-top: 1.05rem; flex-shrink: 0; }
        .handle { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; padding: 0.55rem 0.3rem; color: var(--muted); display: grid; place-items: center; }
        .handle:hover { color: var(--navy-900); }
        .dragging { opacity: 0.8; box-shadow: 0 10px 24px rgba(0, 27, 53, 0.25); position: relative; z-index: 3; }
        .steps .add-dashed { margin-left: 0; }

        /* ---------- Rules ---------- */
        .hc-group { border: 1px solid var(--line); border-radius: 16px; margin-bottom: 1rem; overflow: hidden; }
        .hc-head { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.9rem; background: var(--tint); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
        .hc-num { min-width: 42px; height: 42px; padding: 0 0.5rem; border-radius: 12px; background: var(--navy-900); color: var(--gold-hi); display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; }
        .hc-head b { color: var(--navy-900); }
        .hc-head small { display: block; color: var(--muted); font-size: 0.8rem; }
        .hc-head .push { margin-left: auto; }
        .rule { position: relative; padding: 0.9rem; border-top: 1px solid var(--line); }
        .rule:first-of-type { border-top: none; }
        .rule-line { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) auto; align-items: center; gap: 0.6rem; margin-bottom: 0.55rem; }
        .rule-line.two { grid-template-columns: 9.5rem minmax(0, 1fr) minmax(0, 1fr); }
        .rule-k { font-weight: 800; color: var(--navy-900); font-size: 0.9rem; }
        .rule-sum { color: var(--muted); font-size: 0.84rem; line-height: 1.4; padding: 0.55rem 0.7rem; background: var(--tint); border-radius: 10px; }
        .rule-sum b { color: var(--navy-900); }
        .rule.bad .rule-sum { background: #fef2f2; color: #b91c1c; }
        .hc-add { padding: 0.7rem 0.9rem; border-top: 1px solid var(--line); }
        .add-hc { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .add-hc .sel { width: auto; }

        /* ---------- Save bar ---------- */
        .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 400; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -10px 24px -14px rgba(0, 27, 53, 0.45); display: none; }
        .savebar.on { display: block; }
        .savebar-inner { max-width: 1100px; margin: 0 auto; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .save-msg { flex: 1; min-width: 12rem; font-size: 0.9rem; font-weight: 700; color: var(--muted); }
        .save-msg.dirty { color: #b45309; }
        .save-msg.err { color: #b91c1c; }
        .save-msg.ok { color: #15803d; }

        /* ---------- Loading ---------- */
        .loading { padding: 3rem 1rem; text-align: center; color: var(--muted); }
        .spinner { border: 4px solid var(--line); width: 44px; height: 44px; border-radius: 50%; border-left-color: var(--gold); animation: spin 0.9s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Sign in ---------- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 27, 53, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .sheet { background: #fff; border-radius: 22px; width: 94%; max-width: 420px; max-height: 92vh; overflow: auto; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.55); }
        .sheet-body { padding: 1.6rem 1.5rem 1.5rem; }
        .signin-art { width: 56px; height: 56px; border-radius: 16px; background: var(--navy-900); color: var(--gold-hi); display: grid; place-items: center; margin: 0 auto 0.9rem; }
        .signin h3 { text-align: center; font-size: 1.3rem; color: var(--navy-900); }
        .signin p { text-align: center; color: var(--muted); font-size: 0.9rem; margin: 0.3rem 0 1.2rem; }
        .signin .lbl { margin-top: 0.9rem; }
        .pin-field { text-align: center; letter-spacing: 0.5em; font-size: 1.3rem; font-weight: 800; }
        .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.55rem; margin-top: 1rem; }
        .pin-keypad button { padding: 0.85rem; font-size: 1.35rem; font-weight: 800; background: var(--navy-900); color: #fff; border: none; border-radius: 12px; cursor: pointer; }
        .pin-keypad button:hover { background: var(--navy-700); }
        .pin-keypad button:disabled { opacity: 0.5; cursor: default; }
        .pin-keypad button.muted { background: var(--canvas); color: var(--navy-900); font-size: 0.95rem; }
        .signin-err { margin-top: 0.9rem; padding: 0.55rem 0.75rem; border-radius: 10px; background: #fef2f2; color: #b91c1c; font-size: 0.88rem; font-weight: 700; }
        .signin-err:empty { display: none; }
        .signin .btn-primary { margin-top: 1.1rem; }

        /* ---------- Toast ---------- */
        #toast {
            position: fixed; left: 50%; top: 4.4rem; transform: translate(-50%, -16px); z-index: 3000;
            background: var(--navy-950); color: #fff; padding: 0.7rem 1.1rem; border-radius: 14px; font-weight: 700; font-size: 0.92rem;
            box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.5); max-width: min(92vw, 560px); text-align: center;
            opacity: 0; visibility: hidden; pointer-events: none; transition: transform 0.25s, opacity 0.2s, visibility 0.25s;
        }
        #toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
        #toast.success { background: #065f46; }
        #toast.error { background: #b91c1c; }

        @media (max-width: 820px) {
            .home-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            .appbar-inner { padding: 0.55rem 0.9rem; }
            .who span { display: none; }
            .hero { padding: 1.2rem 1rem 4.2rem; }
            .hero h1 { font-size: 1.55rem; }
            .workspace { padding: 0 0.75rem 2rem; }
            .card-head, .toolbar, .ck-tabs, .ck-hint { padding-left: 1rem; padding-right: 1rem; }
            .card-body { padding: 0.8rem 1rem 1.1rem; }
            .p-head { padding: 0.7rem 1rem; }
            .p-form { padding: 0.4rem 1rem 1.1rem; }
            .p-grid { grid-template-columns: 1fr; }
            .ratings { grid-template-columns: 1fr; }
            .steps { margin-left: 0.6rem; }
            .rule-line, .rule-line.two { grid-template-columns: 1fr; gap: 0.35rem; }
            .rule-line .icon-x { position: absolute; top: 0.6rem; right: 0.6rem; }
            .rule-line > span:empty { display: none; }

// =====================================================================
// API (Apps Script)
// =====================================================================
let auth = { pin: "", name: "" };

class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code || ""; } }

async function api(action, body = {}) {
    const ctrl = new AbortController();
    const tm = setTimeout(() => ctrl.abort(), 45000);
    let res;
    try {
        res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action, pin: auth.pin, ...body }),
            signal: ctrl.signal
        });
    } catch (e) {
        throw new ApiError(e.name === "AbortError" ? "Google took too long to answer. Try again." : "Couldn't reach the editor script. Check your connection.", "network");
    } finally { clearTimeout(tm); }
    let j;
    try { j = await res.json(); } catch (e) { throw new ApiError("The editor script sent back something unexpected. Make sure the new script is deployed.", "bad"); }
    if (!j.ok) {
        if (j.error === "Unknown action.") throw new ApiError("The editor script is still the old version. Paste in sheets-editor-script.gs and deploy a new version.", "old");
        throw new ApiError(j.error || "The script refused.", j.code);
    }
    return j;
}

// SIGN IN

let signingIn = false;

function showSignIn(err) {
    $("siErr").textContent = err || "";
    $("siPin").value = "";
    $("signinModal").classList.add("active");
    setTimeout(() => $("siPin").focus(), 60);
}
function padKey(d) {
    const i = $("siPin");
    if (signingIn || i.value.length >= 4) return;
    i.value += d;
    if (i.value.length === 4) signIn();
}
async function signIn() {
    const pin = $("siPin").value.trim();
    if (signingIn || !pin) return;
    signingIn = true;
    document.querySelectorAll("#siPad button").forEach(b => b.disabled = true);
    $("siErr").textContent = "Checking...";
    auth = { pin, name: "" };
    try {
        const j = await api("login");
        auth.name = j.name;
        try { sessionStorage.setItem("sheetsEditorPin", pin); } catch (e) {}
        $("signinModal").classList.remove("active");
        $("siErr").textContent = "";
        showWho();
        route();
    } catch (e) {
        auth = { pin: "", name: "" };
        $("siErr").textContent = e.message;
        $("siPin").value = "";
    } finally {
        signingIn = false;
        document.querySelectorAll("#siPad button").forEach(b => b.disabled = false);
    }
}
$("siPin").addEventListener("keydown", e => { if (e.key === "Enter") signIn(); });

function showWho() {
    const w = $("who");

}
function signOut() {
    if (cur && isDirty() && !confirm("You have unsaved changes. Sign out anyway?")) return;
    try { sessionStorage.removeItem("sheetsEditorPin"); } catch (e) {}
    auth = { pin: "", name: "" };
    cur = null;
    $("who").classList.remove("on");
    $("signOutBtn").style.display = "none";
    $("panel").innerHTML = "";
    setSaveBar(false);
    showSignIn();
}

// =====================================================================
// NAVIGATION (hash routes so the phone's back button works)
//   #           home
//   #staff
//   #rules
//   #check/<shiftId>/<zone>
// =====================================================================
let cur = null;          // { view, sheetId, model, baseline, version, saving, stale }
let lastHash = location.hash;
let ignoreHash = false;

function go(hash) { location.hash = hash; }

window.addEventListener("hashchange", () => {
    if (ignoreHash) { ignoreHash = false; lastHash = location.hash; return; }
    if (cur && isDirty() && !confirm("You have unsaved changes. Leave without saving?")) {
        ignoreHash = true;
        location.hash = lastHash;
        return;
    }
    lastHash = location.hash;
    route();
});
window.addEventListener("beforeunload", e => { if (cur && isDirty()) { e.preventDefault(); e.returnValue = ""; } });

function setHero(eyebrow, title, sub, back) {
    $("heroEyebrow").textContent = eyebrow;
    $("heroTitle").textContent = title;
    $("heroSub").textContent = sub;
    $("backBtn").classList.toggle("on", !!back);
}

function route() {
    if (!auth.name) return;
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    const parts = h.split("/");
    if (parts[0] === "staff") return openSheet("staff", STAFF_SHEET_ID);
    if (parts[0] === "rules") return openSheet("rules", RULES_SHEET_ID);
    if (parts[0] === "check") {
        const shift = CHECKLISTS.find(c => c.id === parts[1]);
        const zone = parts.slice(2).join("/");
        if (shift && shift.zones[zone]) return openSheet("checklist", shift.zones[zone], { shift, zone });
    }
    renderHome();
}

// =====================================================================
// LOADING / SAVING (shared)
// =====================================================================
async function openSheet(view, sheetId, extra = {}) {
    const titles = {
        staff: ["Staff & PINs", "Staff", "Tap a person to change their details"],
        rules: ["Headcount rules", "Headcount Rules", "Short on people? Pick which areas are hidden and where their work goes"],
        checklist: [extra.shift ? extra.shift.title + " checklist" : "", extra.zone || "", "Tasks and steps people see for this area"]
    }[view];
    setHero(titles[0], titles[1], titles[2], true);
    setSaveBar(false);
    cur = { view, sheetId, ...extra, model: null, baseline: "", version: "", saving: false, stale: false, loading: true };
    const me = cur;
    $("panel").innerHTML = `<section class="card"><div class="loading"><div class="spinner"></div>Loading the sheet...</div></section>`;
    try {
        const j = await api("read", { sheetId });
        if (cur !== me) return;
        loadValues(j.values, j.version);
        cur.loading = false;
        renderView();
    } catch (e) {
        if (cur !== me) return;
        if (/PIN|Too many wrong/i.test(e.message)) { signOut(); $("siErr").textContent = e.message; return; }
        $("panel").innerHTML = `<section class="card"><div class="loading"><b style="color:#b91c1c">${esc(e.message)}</b><br><br>
            <button type="button" class="btn-secondary" onclick="route()">Try again</button></div></section>`;
    }
}

function loadValues(values, version) {
    const v = (values || []).map(r => r.map(c => String(c == null ? "" : c)));
    if (cur.view === "staff") cur.model = parseStaff(v);
    else if (cur.view === "rules") cur.model = parseRules(v);
    else cur.model = parseChecklist(v);
    cur.version = version;
    cur.stale = false;
    cur.baseline = JSON.stringify(buildRows().rows);
}

function buildRows() {
    if (cur.view === "staff") return buildStaff(cur.model);
    if (cur.view === "rules") return buildRules(cur.model);
    return buildChecklist(cur.model, cur.zone);
}

function isDirty() {
    if (!cur || !cur.model) return false;
    return JSON.stringify(buildRows().rows) !== cur.baseline;
}

function renderView() {
    if (cur.view === "staff") renderStaff();
    else if (cur.view === "rules") renderRules();
    else renderChecklist();
    touch();
}

function setSaveBar(on) {
    $("saveBar").classList.toggle("on", on);
    document.body.classList.toggle("has-savebar", on);
}

// Call after any change: refreshes the save bar
function touch(msg, kind) {
    if (!cur || !cur.model) return;
    setSaveBar(true);
    const dirty = isDirty();
    const m = $("saveMsg");
    $("saveBtn").disabled = !dirty || cur.saving || cur.stale;
    $("discardBtn").disabled = (!dirty && !cur.stale) || cur.saving;
    $("discardBtn").textContent = cur.stale ? "Reload" : "Discard";
    if (msg) { m.textContent = msg; m.className = "save-msg " + (kind || ""); return; }
    if (cur.stale) { m.textContent = "Someone else changed this sheet after you opened it. Reload to get the latest."; m.className = "save-msg err"; return; }
    m.textContent = dirty ? "Unsaved changes" : "All changes saved";
    m.className = "save-msg " + (dirty ? "dirty" : "");
}

function discardChanges() {
    if (!cur) return;
    if (!cur.stale && !confirm("Throw away your unsaved changes?")) return;
    if (cur.stale && isDirty() && !confirm("Reloading will throw away your unsaved changes. Reload?")) return;
    cur.baseline = "";
    const c = cur;
    openSheet(c.view, c.sheetId, { shift: c.shift, zone: c.zone });
}

async function saveCurrent() {
    if (!cur || cur.saving || cur.stale) return;
    const { rows, error, focus } = buildRows();
    if (error) {
        touch(error, "err");
        if (focus) focus();
        return;
    }
    cur.saving = true;
    $("saveBtn").textContent = "Saving...";
    touch("Saving...", "");
    const me = cur;
    try {
        const ownBefore = cur.view === "staff" ? ownPin(cur.model) : null;
        const j = await api("write", { sheetId: cur.sheetId, rows, version: cur.version });
        if (cur !== me) return;
        if (ownBefore !== null && ownBefore !== auth.pin) {
            auth.pin = ownBefore;
            try { sessionStorage.setItem("sheetsEditorPin", auth.pin); } catch (e) {}
        }
        const keep = cur.view === "staff" ? { open: null, search: cur.model.search, showPins: cur.model.showPins } : cur.view === "checklist" ? { tab: cur.model.tab } : cur.view === "rules" ? { period: cur.model.period } : {};
        loadValues(j.values, j.version);
        Object.assign(cur.model, keep);
        cur.saving = false;
        $("saveBtn").textContent = "Save changes";
        renderView();
        touch("Saved. The apps pick it up the next time they load.", "ok");
        toast("Saved.", "success");
    } catch (e) {
        if (cur !== me) return;
        cur.saving = false;
        $("saveBtn").textContent = "Save changes";
        if (e.code === "stale") { cur.stale = true; touch(); return; }
        touch(e.message, "err");
    }
}

function normalizeSkillHeader(text) {
    const key = String(text || "").toLowerCase().replace(/[^a-z]/g, "");
    if (!key) return null;
    return SKILL_ALIASES[key] || SKILLS.find(s => s.toLowerCase().replace(/[^a-z]/g, "") === key) || null;
}

function parseStaff(vals) {
    const hasHeader = vals.length > 0 && /^name/i.test((vals[0][0] || "").trim());
    const header = hasHeader ? vals[0].slice() : null;
    const origWidth = Math.max(4, ...vals.map(r => r.length));
    let width = origWidth;
    const skillCol = {};
    if (hasHeader) {
        for (let c = 4; c < origWidth; c++) { const sk = normalizeSkillHeader(header[c]); if (sk && skillCol[sk] === undefined) skillCol[sk] = c; }
        SKILLS.forEach(sk => { if (skillCol[sk] === undefined) skillCol[sk] = width++; });
    } else {
        SKILLS.forEach((sk, i) => { skillCol[sk] = 4 + i; });
        width = Math.max(width, 4 + SKILLS.length);
    }
    const skillIdx = new Set(Object.values(skillCol));
    const extras = [];
    for (let c = 4; c < origWidth; c++) if (!skillIdx.has(c)) extras.push({ idx: c, label: (header && (header[c] || "").trim()) || "Column " + colLetter(c) });
    const rows = vals.slice(hasHeader ? 1 : 0).filter(r => r.some(x => x.trim())).map(r => {
        const cells = Array.from({ length: width }, (_, i) => (r[i] || "").trim());
        return { uid: newUid(), cells, orig: JSON.stringify(cells), isNew: false, deleted: false };
    });
    return { hasHeader, header, origWidth, width, skillCol, extras, rows, open: null, search: "", showPins: false };
}

function liveRows(S) { return S.rows.filter(r => !r.deleted); }

function staffErrors(S) {
    const errs = {}, names = {}, pins = {};
    liveRows(S).forEach(r => {
        const n = r.cells[0].trim(), p = r.cells[1].trim();
        if (!n) { errs[r.uid] = "Needs a name."; return; }
        const k = n.toLowerCase();
        if (names[k]) errs[r.uid] = `Another person is already named ${n}.`;
        names[k] = true;
        if (p && !/^\d+$/.test(p)) errs[r.uid] = "The PIN can only have numbers.";
        else if (p) { if (pins[p]) errs[r.uid] = `Same PIN as ${pins[p]}.`; else pins[p] = n; }
    });
    return errs;
}

function ownPin(S) {
    const me = liveRows(S).find(r => r.cells[0].trim().toLowerCase() === auth.name.toLowerCase());
    return me ? me.cells[1].trim() : null;
}

function buildStaff(S) {
    const live = liveRows(S);
    const used = c => live.some(r => (r.cells[c] || "").trim());
    let cols;
    if (S.hasHeader) {
        cols = [];
        for (let c = 0; c < S.width; c++) if (c < S.origWidth || used(c)) cols.push(c);
    } else {
        let maxUsed = S.origWidth - 1;
        for (let c = S.origWidth; c < S.width; c++) if (used(c)) maxUsed = c;
        cols = Array.from({ length: maxUsed + 1 }, (_, i) => i);
    }
    const skillAt = c => Object.keys(S.skillCol).find(k => S.skillCol[k] === c) || "";
    const rows = [];
    if (S.hasHeader) rows.push(cols.map(c => c < S.origWidth ? (S.header[c] || "") : skillAt(c)));
    live.forEach(r => rows.push(cols.map(c => (r.cells[c] || "").trim())));

    let error = null, focus = null;
    const errs = staffErrors(S);
    const bad = live.find(r => errs[r.uid]);
    if (!live.length) error = "Keep at least one person on the list.";
    else if (bad) {
        error = `${bad.cells[0].trim() || "Someone"}: ${errs[bad.uid]}`;
        focus = () => { S.open = bad.uid; renderStaff(); scrollToPerson(bad.uid); };
    } else if (ownPin(S) === null || ownPin(S) === "") {
        error = "You can't remove or rename yourself, or clear your own PIN. It would lock you out of the editor.";
    }
    return { rows, error, focus };
}

function personStatus(r) {
    if (r.isNew) return '<span class="tag new">New</span>';
    if (JSON.stringify(r.cells) !== r.orig) return '<span class="tag edit">Edited</span>';
    return "";
}

function personHeadHtml(r, errs) {

}

function rateRow(r, sk) {

function personFormHtml(r, errs) {

                ${pin && pin.length !== 4 ? `<div class="hint-line">Checklist sign-in uses 4-digit PINs.</div>` : ""}</div>
        </div>
        <div class="p-row">
            <div><label class="lbl">Role</label><div class="seg">
                <button type="button" class="${role === "member" || !role ? "on" : ""}" onclick="setCell('${r.uid}', 2, 'member', true)">Team Member</button>
                <button type="button" class="${role === "leader" ? "on" : ""}" onclick="setCell('${r.uid}', 2, 'leader', true)">Leader</button>
                ${customRole ? `<button type="button" class="on">${esc(r.cells[2])}</button>` : ""}
            </div></div>
            <div><label class="lbl">House</label><div class="seg">
                <button type="button" class="${house !== "boh" ? "on" : ""}" onclick="setCell('${r.uid}', 3, 'foh', true)">Front (FOH)</button>
                <button type="button" class="${house === "boh" ? "on" : ""}" onclick="setCell('${r.uid}', 3, 'boh', true)">Back (BOH)</button>
            </div></div>
        </div>
        <div class="sub-title">Position ratings <span style="text-transform:none;letter-spacing:0;font-weight:600">· 1 needs work, 5 is an ace</span></div>
        <div class="ratings">${SKILLS.map(sk => rateRow(r, sk)).join("")}</div>
        ${S.extras.length ? `<div class="sub-title">Other columns</div><div class="p-grid" style="margin-top:0.4rem">${S.extras.map(x =>
            `<div><label class="lbl">${esc(x.label)}</label><input class="field" value="${esc(r.cells[x.idx])}" oninput="setCell('${r.uid}', ${x.idx}, this.value)"></div>`).join("")}</div>` : ""}
        ${errs[r.uid] ? `<div class="err-line">${esc(errs[r.uid])}</div>` : ""}
        <div class="p-foot">
            <button type="button" class="link-btn danger" onclick="removePerson('${r.uid}')">Remove ${esc(r.cells[0].trim() || "this person")}</button>

        </div>

}

function personHtml(r, errs) {
    const role = r.cells[2].trim().toLowerCase();
    return `<div class="person ${cur.model.open === r.uid ? "open" : ""} ${role === "leader" ? "leader" : ""}" id="p-${r.uid}">
        <button type="button" class="p-head" onclick="togglePerson('${r.uid}')">${personHeadHtml(r, errs)}</button>
        ${cur.model.open === r.uid ? personFormHtml(r, errs) : ""}
    </div>`;
}

function matchesSearch(r, q) {
    if (!q) return true;
    return r.cells[0].toLowerCase().includes(q) || r.cells[1].includes(q);
}

function renderStaff() {
    const S = cur.model;
    const live = liveRows(S);
    const removed = S.rows.filter(r => r.deleted && !r.isNew).length;
    $("panel").innerHTML = `
        <section class="card">
            <div class="card-head">
                <div><div class="card-title">Staff list</div><div class="card-sub">${S.hasHeader ? "Ratings are matched by the column headers in the sheet" : "Ratings are in columns E–M"}</div></div>
                <span class="count-pill push" id="staffCount">${live.length} ${live.length === 1 ? "person" : "people"}</span>
            </div>
            <div class="toolbar">
                <div class="search-field">${IC.search}<input class="field" id="staffSearch" placeholder="Search by name or PIN" value="${esc(S.search)}" oninput="cur.model.search=this.value; renderStaffList()"></div>
                <button type="button" class="btn-secondary ${S.showPins ? "on" : ""}" onclick="cur.model.showPins=!cur.model.showPins; renderStaff()">${IC.eye} PINs</button>
                <button type="button" class="btn-secondary" onclick="sortStaff()" title="Sort the sheet A to Z">${IC.sort} A–Z</button>
                <button type="button" class="btn-dark" onclick="addPerson()">${IC.plus} Add person</button>
            </div>
            <div class="people" id="staffList"></div>
            ${removed ? `<div class="card-body" style="padding-top:0.8rem"><span class="note">${removed} ${removed === 1 ? "person" : "people"} will be removed when you save.</span>
                <button type="button" class="link-btn" onclick="cur.model.rows.forEach(r => r.deleted = false); renderStaff(); touch()">Bring them back</button></div>` : ""}
        </section>`;
    renderStaffList();
}

function renderStaffList() {
    const S = cur.model;
    const q = S.search.trim().toLowerCase();
    const errs = staffErrors(S);
    const list = liveRows(S).filter(r => r.isNew || r.uid === S.open || matchesSearch(r, q));
    $("staffList").innerHTML = list.length ? list.map(r => personHtml(r, errs)).join("")
        : `<div class="empty-note">${q ? "Nobody matches that search." : "Nobody on the list yet."}</div>`;
}

function refreshPersonHead(uid) {
    const r = cur.model.rows.find(x => x.uid === uid);
    const el = document.querySelector(`#p-${uid} > .p-head`);
    if (r && el) el.innerHTML = personHeadHtml(r, staffErrors(cur.model));
}

function scrollToPerson(uid) {
    const el = $("p-" + uid);
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

function togglePerson(uid) {
    const S = cur.model;
    S.open = S.open === uid ? null : uid;
    renderStaffList();
    if (S.open) {
        const el = $("p-" + uid);
        if (el) {
            const top = el.getBoundingClientRect().top;
            if (top < 70 || top > window.innerHeight - 200) el.scrollIntoView({ block: "start", behavior: "smooth" });
        }
    }
}

function setCell(uid, col, val, rerender) {
    const r = cur.model.rows.find(x => x.uid === uid);
    if (!r) return;
    r.cells[col] = val;
    if (rerender) {
        const el = $("p-" + uid);
        if (el) el.outerHTML = personHtml(r, staffErrors(cur.model));
    } else refreshPersonHead(uid);
    const pill = $("staffCount");
    if (pill) { const n = liveRows(cur.model).length; pill.textContent = `${n} ${n === 1 ? "person" : "people"}`; }
    touch();
}

function addPerson() {
    const S = cur.model;
    const r = { uid: newUid(), cells: Array.from({ length: S.width }, () => ""), orig: "", isNew: true, deleted: false };
    r.cells[2] = "member";
    r.cells[3] = "foh";
    S.rows.push(r);
    S.open = r.uid;
    S.search = "";
    renderStaff();
    touch();
    scrollToPerson(r.uid);
    setTimeout(() => { const i = document.querySelector(`#p-${r.uid} [data-first]`); if (i) i.focus({ preventScroll: true }); }, 250);
}

function removePerson(uid) {
    const S = cur.model;
    const r = S.rows.find(x => x.uid === uid);
    if (!r) return;
    const n = r.cells[0].trim();
    if (n && n.toLowerCase() === auth.name.toLowerCase()) { toast("You can't remove yourself.", "error"); return; }
    if (n && !confirm(`Remove ${n} from the staff list? They won't be able to sign in to the Checklist Tracker.`)) return;
    if (r.isNew) S.rows = S.rows.filter(x => x !== r); else r.deleted = true;
    S.open = null;
    renderStaff();
    touch();
}

function undoPerson(uid) {
    const r = cur.model.rows.find(x => x.uid === uid);
    if (!r || r.isNew) return;
    r.cells = JSON.parse(r.orig);
    const el = $("p-" + uid);
    if (el) el.outerHTML = personHtml(r, staffErrors(cur.model));
    touch();
}

function sortStaff() {
    const S = cur.model;
    S.rows.sort((a, b) => a.cells[0].trim().localeCompare(b.cells[0].trim()));
    renderStaffList();
    touch();
    toast("Sorted A–Z. Save to keep the new order in the sheet.");
}

// =====================================================================
// CHECKLIST
// =====================================================================
const SECTIONS = ["Do", "Verify", "Preclose"];
const SECTION_LABEL = { Do: "Checklist", Verify: "Verify", Preclose: "Preclose" };
const SECTION_HINT = {
    Do: "The cards people flip as they work this area.",
    Verify: "What the leader checks when verifying this area. Leave empty to use the built-in verify cards.",
    Preclose: "Tasks people can do early, before close. Offered when they open this area."
};

function parseChecklist(values) {
    const typeOf = c => String(c || "").trim().toLowerCase();
    const isType = v => ["do", "verify", "preclose", "title"].includes(v);
    let typeCol = -1;
    for (const col of [4, 3, 2]) if (values.some(r => isType(typeOf(r[col])))) { typeCol = col; break; }
    const L = typeCol === 4 ? { sub: 1, task: 2, step: 3, type: 4 }
        : typeCol === 3 ? { sub: 0, task: 1, step: 2, type: 3 }
        : typeCol === 2 ? { sub: -1, task: 0, step: 1, type: 2 }
        : { sub: -1, task: 0, step: 1, type: -1 };
    const model = { title: "", sections: {}, tab: "Do" };
    SECTIONS.forEach(s => { model.sections[s] = { subtitle: "", tasks: [] }; });
    values.forEach(r => {
        const task = (r[L.task] || "").trim();
        const step = (r[L.step] || "").trim();
        const type = L.type >= 0 ? typeOf(r[L.type]) : "do";
        if (task.toLowerCase() === "task" && step.toLowerCase() === "step") return;
        if (type === "title") { if (!model.title) model.title = task || step; return; }
        if (!task || !step) return;
        const sec = model.sections[type === "verify" ? "Verify" : type === "preclose" ? "Preclose" : "Do"];
        const sub = L.sub >= 0 ? (r[L.sub] || "").trim() : "";
        if (sub && !sec.subtitle) sec.subtitle = sub;
        let t = sec.tasks.find(x => x.title === task);
        if (!t) { t = { uid: newUid(), title: task, steps: [] }; sec.tasks.push(t); }
        t.steps.push(step);
    });
    return model;
}

function buildChecklist(M, zone) {
    const rows = [["Area", "Subtitle", "Task", "Step", "Type"]];
    let error = null, focus = null;
    if (M.title.trim()) rows.push([zone, "", M.title.trim(), "", "Title"]);
    SECTIONS.forEach(name => {
        const sec = M.sections[name];
        const seen = {};
        sec.tasks.forEach(t => {
            const title = t.title.trim();
            const steps = t.steps.map(s => s.trim()).filter(Boolean);
            if (!title && !steps.length) return;
            const fix = () => { M.tab = name; renderChecklist(); const el = document.querySelector(`[data-tu="${t.uid}"]`); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" }); };
            if (!error && !title) { error = `${SECTION_LABEL[name]}: a task has steps but no name.`; focus = fix; }
            else if (!error && !steps.length) { error = `${SECTION_LABEL[name]}: "${title}" needs at least one step.`; focus = fix; }
            else if (!error && seen[title.toLowerCase()]) { error = `${SECTION_LABEL[name]}: two tasks are named "${title}". Give them different names.`; focus = fix; }
            seen[title.toLowerCase()] = true;
            if (title && steps.length) steps.forEach(s => rows.push([zone, name === "Verify" ? "" : sec.subtitle.trim(), title, s, name]));
        });
    });
    if (!error && !M.sections.Do.tasks.some(t => t.title.trim() && t.steps.some(s => s.trim()))) {
        error = "The checklist needs at least one task.";
        focus = () => { M.tab = "Do"; renderChecklist(); };
    }
    return { rows, error, focus };
}

function hasPreclose() {
    const M = cur.model;
    return (PRECLOSE_ZONES[cur.shift.id] || []).includes(cur.zone) || M.sections.Preclose.tasks.length > 0;
}

function renderChecklist() {
    const M = cur.model;
    const tabs = SECTIONS.filter(s => s !== "Preclose" || hasPreclose());
    if (!tabs.includes(M.tab)) M.tab = "Do";
    const sec = M.sections[M.tab];
    const count = s => M.sections[s].tasks.length;
    $("panel").innerHTML = `
        <section class="card">
            <div class="card-head">
                <div style="flex:1; min-width: 14rem">
                    <label class="lbl" for="ckTitle">Card title</label>
                    <input class="field" id="ckTitle" value="${esc(M.title)}" placeholder="${esc(cur.zone)} (leave empty to use the area name)" oninput="cur.model.title=this.value; touch()">
                </div>
            </div>
            <div class="ck-tabs" style="margin-top:0.6rem">
                <div class="seg">${tabs.map(t => `<button type="button" class="${t === M.tab ? "on" : ""}" onclick="cur.model.tab='${t}'; renderChecklist()">${SECTION_LABEL[t]} <span style="opacity:0.6">${count(t)}</span></button>`).join("")}</div>
            </div>
            <p class="ck-hint">${SECTION_HINT[M.tab]} Drag ${IC.grip.replace('width="16" height="16"', 'width="13" height="13" style="vertical-align:-2px"')} to reorder.</p>
            <div class="card-body">
                ${M.tab !== "Verify" ? `<div style="margin-bottom:1rem">
                    <label class="lbl" for="ckSub">${M.tab === "Preclose" ? 'Preclose start time, e.g. "Start at 8:00 PM"' : "Subtitle under the area name (optional)"}</label>
                    <input class="field" id="ckSub" value="${esc(sec.subtitle)}" oninput="ckSec().subtitle=this.value; touch()">
                </div>` : ""}
                <div id="ckTasks">${sec.tasks.map((t, ti) => taskHtml(t, ti)).join("")}</div>
                ${sec.tasks.length ? "" : `<p class="note" style="margin-bottom:0.8rem">No ${SECTION_LABEL[M.tab].toLowerCase()} tasks yet.</p>`}
                <button type="button" class="add-dashed" onclick="ckAddTask()">+ Add task</button>
            </div>
        </section>`;
    document.querySelectorAll("#ckTasks textarea").forEach(autosize);
}

function taskHtml(t, ti) {
    return `<div class="task" data-ti="${ti}" data-tu="${t.uid}">
        <div class="task-head">
            <span class="handle" title="Drag to reorder">${IC.grip}</span>
            <span class="task-num">${ti + 1}</span>
            <input class="field" value="${esc(t.title)}" placeholder="Task name (e.g. Clean Lowboy)" oninput="ckSec().tasks[${ti}].title=this.value; touch()">
            <button type="button" class="icon-x" title="Delete task" onclick="ckDelTask(${ti})">${IC.x}</button>
        </div>
        <div class="steps">
            ${t.steps.map((s, si) => `<div class="step" data-si="${si}">
                <span class="handle" title="Drag to reorder">${IC.grip}</span>
                <textarea class="field" rows="1" placeholder="Step description" oninput="ckSec().tasks[${ti}].steps[${si}]=this.value; autosize(this); touch()">${esc(s)}</textarea>
                <button type="button" class="icon-x" title="Delete step" onclick="ckDelStep(${ti}, ${si})">${IC.x}</button>
            </div>`).join("")}
            <button type="button" class="add-dashed small" onclick="ckAddStep(${ti})">+ Add step</button>
        </div>
    </div>`;
}

function ckSec() { return cur.model.sections[cur.model.tab]; }
function ckAddTask() {
    ckSec().tasks.push({ uid: newUid(), title: "", steps: [""] });
    renderChecklist(); touch();
    const all = document.querySelectorAll("#ckTasks .task");
    const last = all[all.length - 1];
    if (last) { last.scrollIntoView({ block: "center", behavior: "smooth" }); last.querySelector(".task-head input").focus({ preventScroll: true }); }
}
function ckAddStep(ti) {
    ckSec().tasks[ti].steps.push("");
    renderChecklist(); touch();
    const t = document.querySelectorAll("#ckTasks .task")[ti];
    if (t) { const ta = t.querySelectorAll(".step textarea"); const l = ta[ta.length - 1]; if (l) l.focus(); }
}
function ckDelTask(ti) {
    const t = ckSec().tasks[ti];
    if ((t.title.trim() || t.steps.some(s => s.trim())) && !confirm(`Delete the task "${t.title.trim() || "untitled"}" and its steps?`)) return;
    ckSec().tasks.splice(ti, 1);
    renderChecklist(); touch();
}
function ckDelStep(ti, si) {
    const steps = ckSec().tasks[ti].steps;
    steps.splice(si, 1);
    if (!steps.length) steps.push("");
    renderChecklist(); touch();
}

// Drag to reorder tasks and steps (mouse and touch)
document.addEventListener("pointerdown", e => {
    const handle = e.target.closest && e.target.closest("#ckTasks .handle");
    if (!handle || !cur || cur.view !== "checklist") return;
    const item = handle.closest(".step") || handle.closest(".task");
    if (!item) return;
    e.preventDefault();
    const isTask = item.classList.contains("task");
    const container = item.parentElement;
    item.classList.add("dragging");
    let lastY = e.clientY, scroller = null;
    const move = ev => {
        lastY = ev.clientY;
        const sibs = Array.from(container.children).filter(c => c !== item && c.classList.contains(isTask ? "task" : "step"));
        let placed = false;
        for (const s of sibs) {
            const r = s.getBoundingClientRect();
            if (lastY < r.top + r.height / 2) { container.insertBefore(item, s); placed = true; break; }
        }
        if (!placed) {
            const addBtn = isTask ? null : container.querySelector(".add-dashed");
            container.insertBefore(item, addBtn);
        }
    };
    scroller = setInterval(() => {
        if (lastY < 90) window.scrollBy(0, -12);
        else if (lastY > window.innerHeight - 110) window.scrollBy(0, 12);
    }, 16);
    const up = () => {
        clearInterval(scroller);
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        document.removeEventListener("pointercancel", up);
        item.classList.remove("dragging");
        const attr = isTask ? "data-ti" : "data-si";
        const order = Array.from(container.children).filter(c => c.hasAttribute(attr)).map(c => parseInt(c.getAttribute(attr), 10));
        if (order.some((v, i) => v !== i)) {
            if (isTask) { const list = ckSec().tasks; ckSec().tasks = order.map(i => list[i]); }
            else {
                const ti = parseInt(item.closest(".task").getAttribute("data-ti"), 10);
                const list = ckSec().tasks[ti].steps;
                ckSec().tasks[ti].steps = order.map(i => list[i]);
            }
        }
        renderChecklist();
        touch();
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
});

// =====================================================================
// HEADCOUNT RULES
// Sheet: Period | Headcount | Hidden Zone | Absorbing Period | Absorbing Zone | Extra Task | Extra Step | Display Name
// Extra Task "*" moves the hidden zone's whole checklist.
// =====================================================================
const RULE_HEADER = ["Period", "Headcount", "Hidden Zone", "Absorbing Period", "Absorbing Zone", "Extra Task", "Extra Step", "Display Name"];
function periodKey(raw) { const d = String(raw || "").replace(/\D/g, ""); return d === "930" || d === "1030" ? d : null; }
function zonesFor(p) {
    const shift = CHECKLISTS.find(c => c.id === PERIODS[p].shift);
    const names = Object.keys(shift.zones);
    (cur && cur.model && cur.model.rules ? cur.model.rules : []).forEach(r => {
        if (r.period === p && r.hidden && !names.includes(r.hidden)) names.push(r.hidden);
        if (r.absPeriod === p && r.absZone && !names.includes(r.absZone)) names.push(r.absZone);
    });
    return names;
}

function parseRules(values) {
    const rules = [], junk = [];
    let width = 8;
    values.forEach((r, i) => {
        const c = k => (r[k] || "").trim();
        if (i === 0 && c(0).toLowerCase() === "period") { width = Math.max(width, r.length); return; }
        if (!r.some(x => x.trim())) return;
        width = Math.max(width, r.length);
        const p = periodKey(c(0)), hc = parseInt(c(1), 10);
        if (!p || isNaN(hc) || !c(2)) { junk.push(r.slice()); return; }
        const absZone = c(4);
        const task = c(5);
        rules.push({
            uid: newUid(), period: p, hc, hidden: c(2),
            absPeriod: periodKey(c(3)) || p, absZone,
            mode: !absZone ? "whole" : task === "*" ? "whole" : task ? "task" : "none",
            task: task === "*" ? "" : task, step: c(6), display: c(7),
            extra: r.slice(8)
        });
    });
    return { rules, junk, width, period: "930", addHc: "" };
}

function buildRules(M) {
    const rows = [RULE_HEADER.slice()];
    let error = null, focus = null;
    const sorted = M.rules.slice().sort((a, b) => (a.period === b.period ? 0 : a.period === "930" ? -1 : 1) || a.hc - b.hc);
    const seen = {};
    sorted.forEach(r => {
        const fix = () => { M.period = r.period; renderRules(); const el = document.querySelector(`[data-ru="${r.uid}"]`); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" }); };
        const err = ruleError(r, seen);
        if (err && !error) { error = `${PERIODS[r.period].label}, ${r.hc} people: ${err}`; focus = fix; }
        seen[`${r.period}|${r.hc}|${r.hidden}`] = true;
        const dest = !!r.absZone;
        rows.push([
            r.period, String(r.hc), r.hidden,
            dest ? r.absPeriod : "", dest ? r.absZone : "",
            dest ? (r.mode === "whole" ? "*" : r.mode === "task" ? r.task.trim() : "") : "",
            dest && r.mode === "task" ? r.step.trim() : "",
            dest ? r.display.trim() : "",
            ...r.extra
        ]);
    });
    M.junk.forEach(j => rows.push(j.slice()));
    const w = Math.max(8, ...rows.map(r => r.length));
    return { rows: rows.map(r => Array.from({ length: w }, (_, i) => r[i] || "")), error, focus };
}

function ruleError(r, seen) {
    if (!r.hidden) return "pick the area to hide.";
    if (seen && seen[`${r.period}|${r.hc}|${r.hidden}`]) return `${r.hidden} is hidden twice.`;
    if (r.absZone && r.absZone === r.hidden && r.absPeriod === r.period) return "an area can't take its own work.";
    if (r.absZone && r.mode === "task" && !r.task.trim()) return "give the extra task a name.";
    return null;
}

function ruleSummary(r) {
    if (!r.hidden) return "Pick an area to hide.";
    const where = r.absZone ? `<b>${esc(r.absZone)}</b>${r.absPeriod !== r.period ? ` (${PERIODS[r.absPeriod].label})` : ""}` : "";
    let s = `<b>${esc(r.hidden)}</b> is hidden`;
    if (!r.absZone) s += " and nobody picks up its work.";
    else if (r.mode === "whole") s += `. Its whole checklist is added to ${where}.`;
    else if (r.mode === "task") s += `. ${where} gets an extra task${r.task.trim() ? `: <b>${esc(r.task.trim())}</b>` : ""}.`;
    else s += `.`;
    if (r.absZone && r.display.trim()) s += ` ${where} shows as <b>${esc(r.display.trim())}</b>.`;
    return s;
}

function zoneOptions(p, sel, placeholder) {
    const names = zonesFor(p);
    return (placeholder ? `<option value="">${esc(placeholder)}</option>` : "") + names.map(n => `<option ${n === sel ? "selected" : ""}>${esc(n)}</option>`).join("");
}
function destOptions(r) {
    const val = r.absZone ? r.absPeriod + "|" + r.absZone : "";
    let html = `<option value="" ${val ? "" : "selected"}>Nobody (just hide it)</option>`;
    ["930", "1030"].forEach(p => {
        html += `<optgroup label="${PERIODS[p].label}">${zonesFor(p).filter(n => !(p === r.period && n === r.hidden)).map(n =>
            `<option value="${esc(p + "|" + n)}" ${val === p + "|" + n ? "selected" : ""}>${esc(n)}</option>`).join("")}</optgroup>`;
    });
    return html;
}

function ruleHtml(r) {
    const err = ruleError(r);
    return `<div class="rule ${err && r.hidden ? "bad" : ""}" data-ru="${r.uid}">
        <div class="rule-line">
            <span class="rule-k">Hide</span>
            <select class="sel" onchange="setRule('${r.uid}', 'hidden', this.value, true)">${zoneOptions(r.period, r.hidden, "Pick an area")}</select>
            <button type="button" class="icon-x" title="Delete this rule" onclick="delRule('${r.uid}')">${IC.x}</button>
        </div>
        <div class="rule-line">
            <span class="rule-k">Its work goes to</span>
            <select class="sel" onchange="setDest('${r.uid}', this.value)">${destOptions(r)}</select>
            <span></span>
        </div>
        ${r.absZone ? `
        <div class="rule-line">
            <span class="rule-k">What moves</span>
            <div class="seg">
                <button type="button" class="${r.mode === "whole" ? "on" : ""}" onclick="setRule('${r.uid}', 'mode', 'whole', true)">Whole checklist</button>
                <button type="button" class="${r.mode === "task" ? "on" : ""}" onclick="setRule('${r.uid}', 'mode', 'task', true)">One task</button>
                <button type="button" class="${r.mode === "none" ? "on" : ""}" onclick="setRule('${r.uid}', 'mode', 'none', true)">Nothing</button>
            </div>
            <span></span>
        </div>
        ${r.mode === "task" ? `<div class="rule-line two">
            <span class="rule-k">Extra task</span>
            <input class="field" value="${esc(r.task)}" placeholder="Task name, e.g. Bathroom Trash" oninput="setRule('${r.uid}', 'task', this.value)">
            <input class="field" value="${esc(r.step)}" placeholder="Step (optional)" oninput="setRule('${r.uid}', 'step', this.value)">
        </div>` : ""}
        <div class="rule-line">
            <span class="rule-k">Rename to</span>
            <input class="field" value="${esc(r.display)}" placeholder="Keep the name ${esc(r.absZone)}" oninput="setRule('${r.uid}', 'display', this.value)">
            <span></span>
        </div>` : ""}
        <div class="rule-sum" id="sum-${r.uid}">${ruleSummary(r)}</div>
    </div>`;
}

function renderRules() {
    const M = cur.model;
    const p = M.period;
    const mine = M.rules.filter(r => r.period === p);
    const counts = [...new Set(mine.map(r => r.hc))].sort((a, b) => b - a);
    const used = new Set(counts);
    const free = [];
    for (let n = PERIODS[p].max; n >= PERIODS[p].min; n--) if (!used.has(n)) free.push(n);
    // Suggest the next count below the smallest one that already has rules
    const lowest = counts.length ? Math.min(...counts) : null;
    const suggest = free.find(n => lowest === null || n < lowest) ?? free[0];
    const n930 = M.rules.filter(r => r.period === "930").length, n1030 = M.rules.filter(r => r.period === "1030").length;
    $("panel").innerHTML = `
        <section class="card">
            <div class="card-head">
                <div class="seg">
                    <button type="button" class="${p === "930" ? "on" : ""}" onclick="cur.model.period='930'; renderRules()">9:30 Close <span style="opacity:0.6">${n930}</span></button>
                    <button type="button" class="${p === "1030" ? "on" : ""}" onclick="cur.model.period='1030'; renderRules()">10:30 Close <span style="opacity:0.6">${n1030}</span></button>
                </div>
            </div>
            <div class="card-body">
                <p class="note" style="margin-bottom:1rem">${p === "930"
                    ? "The 9:30 headcount counts the 9s plus any 10s left over after the 10:30 areas are covered. With more people than any rule below, every area stays open."
                    : "The 10:30 headcount counts the people closing until 10:30. With more people than any rule below, every area stays open."}</p>
                ${counts.map(hc => `
                    <div class="hc-group">
                        <div class="hc-head">
                            <span class="hc-num">${hc}</span>
                            <div><b>With ${hc} ${hc === 1 ? "person" : "people"}</b><small>${mine.filter(r => r.hc === hc).length} ${mine.filter(r => r.hc === hc).length === 1 ? "area" : "areas"} hidden</small></div>
                            <button type="button" class="link-btn danger push" onclick="delHeadcount(${hc})">Remove</button>
                        </div>
                        ${mine.filter(r => r.hc === hc).map(ruleHtml).join("")}
                        <div class="hc-add"><button type="button" class="add-dashed small" onclick="addRule(${hc})">+ Hide another area</button></div>
                    </div>`).join("") || `<div class="empty-note" style="padding:1rem 0 1.4rem">No rules for the ${PERIODS[p].label} yet, so every area always stays open.</div>`}
                <div class="add-hc">
                    <span class="rule-k">Add a headcount:</span>
                    <select class="sel" id="addHcSel">${free.map(n => `<option value="${n}" ${n === suggest ? "selected" : ""}>${n} ${n === 1 ? "person" : "people"}</option>`).join("")}</select>
                    <button type="button" class="btn-dark" onclick="addHeadcount()" ${free.length ? "" : "disabled"}>${IC.plus} Add</button>
                </div>
                ${M.junk.length ? `<p class="note" style="margin-top:1rem">${M.junk.length} row${M.junk.length === 1 ? "" : "s"} in the sheet couldn't be read as a rule and will be kept as ${M.junk.length === 1 ? "it is" : "they are"}.</p>` : ""}
            </div>
        </section>`;
}

function findRule(uid) { return cur.model.rules.find(r => r.uid === uid); }
function setRule(uid, key, val, rerender) {
    const r = findRule(uid);
    if (!r) return;
    r[key] = val;
    if (key === "hidden" && r.absZone === val && r.absPeriod === r.period) r.absZone = "";
    if (rerender) renderRules();
    else { const s = $("sum-" + uid); if (s) s.innerHTML = ruleSummary(r); }
    touch();
}
function setDest(uid, val) {
    const r = findRule(uid);
    if (!r) return;
    if (!val) { r.absZone = ""; }
    else {
        const [p, ...z] = val.split("|");
        r.absPeriod = p;
        r.absZone = z.join("|");
        if (r.mode === "none" && !r.display) r.mode = "whole";
    }
    renderRules();
    touch();
}
function addRule(hc) {
    const p = cur.model.period;
    const taken = new Set(cur.model.rules.filter(r => r.period === p && r.hc === hc).map(r => r.hidden));
    const first = zonesFor(p).find(z => !taken.has(z)) || "";
    const r = { uid: newUid(), period: p, hc, hidden: first, absPeriod: p, absZone: "", mode: "whole", task: "", step: "", display: "", extra: [] };
    cur.model.rules.push(r);
    renderRules();
    touch();
    const el = document.querySelector(`[data-ru="${r.uid}"]`);
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}
function delRule(uid) {
    cur.model.rules = cur.model.rules.filter(r => r.uid !== uid);
    renderRules();
    touch();
}
function delHeadcount(hc) {
    const p = cur.model.period;
    if (!confirm(`Remove every rule for ${hc} ${hc === 1 ? "person" : "people"} on the ${PERIODS[p].label}?`)) return;
    cur.model.rules = cur.model.rules.filter(r => !(r.period === p && r.hc === hc));
    renderRules();
    touch();
}
function addHeadcount() {
    const sel = $("addHcSel");
    if (!sel || !sel.value) return;
    addRule(+sel.value);
}

(async function start() {
    let pin = "";
    try { pin = sessionStorage.getItem("sheetsEditorPin") || ""; } catch (e) {}
    if (pin) {
        auth = { pin, name: "" };
        $("panel").innerHTML = `<section class="card"><div class="loading"><div class="spinner"></div>Signing in...</div></section>`;
        try {
            const j = await api("login");
            auth.name = j.name;
            showWho();
            route();
            return;
        } catch (e) {
            auth = { pin: "", name: "" };
            $("panel").innerHTML = "";
        }
    }
    showSignIn();
})();
