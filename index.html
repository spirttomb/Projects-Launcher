<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#001b35">
    <title>Projects</title>
    <style>
        @font-face {
            font-family: 'Apercu Regular Pro';
            src: url('apercu_regular_pro.otf') format('opentype'),
                 url('https://spirttomb.github.io/Checklist-Tracker/apercu_regular_pro.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --navy-950: #001b35;
            --navy-900: #002a4f;
            --navy-800: #003d73;
            --navy-700: #044e8f;
            --gold: #f59e0b;
            --gold-hi: #fbbf24;
            --gold-soft: #fef3c7;
            --ink: #1e293b;
            --muted: #5C768D;
            --line: #e1e8f0;
            --line-strong: #c7d3e0;
            --tint: #f5f8fb;
            --canvas: #edf1f6;
            --cw: 280px;
            --ch: 364px;
            --shadow-sm: 0 1px 2px rgba(0, 27, 53, 0.06), 0 2px 6px rgba(0, 27, 53, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Apercu Regular Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(1200px 420px at 85% -10%, rgba(245, 158, 11, 0.16), transparent 60%),
                linear-gradient(180deg, var(--navy-800) 0%, var(--navy-900) 65%, var(--navy-950) 100%);
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        input, select, textarea, button { font-family: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        svg { flex-shrink: 0; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ---------- App bar ---------- */
        .appbar { background: var(--navy-950); position: sticky; top: 0; z-index: 60; }
        .appbar-inner { max-width: 1200px; margin: 0 auto; padding: 0.65rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
        .brand { display: flex; align-items: center; gap: 0.7rem; }
        .brand-mark {
            width: 36px; height: 36px; border-radius: 11px; background: var(--gold); color: var(--navy-950);
            display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
        }
        .brand-name { font-weight: 800; font-size: 1.08rem; letter-spacing: -0.01em; line-height: 1; }
        .brand-name small { display: block; font-weight: 600; font-size: 0.66rem; color: #8ea6bf; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 0.25rem; }
        .appbar-actions { margin-left: auto; display: flex; align-items: center; gap: 0.35rem; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 11px; border: none; background: transparent; color: #c6d5e4;
            display: grid; place-items: center; cursor: pointer; transition: background 0.15s, color 0.15s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .bar-add {
            display: inline-flex; align-items: center; gap: 0.4rem; border: none; border-radius: 11px; cursor: pointer;
            background: var(--gold); color: var(--navy-950); font-weight: 800; font-size: 0.9rem; padding: 0.55rem 0.9rem;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
        }
        .bar-add:hover { background: var(--gold-hi); }

        /* ---------- Hero ---------- */
        .hero { max-width: 1200px; width: 100%; margin: 0 auto; padding: 1.8rem 1.5rem 0.2rem; text-align: center; }
        .eyebrow { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-hi); }
        .hero h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.35rem; line-height: 1.1; }
        .hero-sub { color: #aebfd1; font-size: 0.92rem; margin-top: 0.4rem; }

        /* ---------- Carousel ---------- */
        main { flex: 1; display: flex; flex-direction: column; }
        .stage {
            position: relative; width: 100%; height: calc(var(--ch) + 84px);
            perspective: 1300px; perspective-origin: 50% 42%;
            touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; outline: none;
            overflow: hidden;
        }
        .stage.dragging { cursor: grabbing; }
        .stage:focus-visible .pcard.front .pc-inner { box-shadow: 0 0 0 3px var(--gold), 0 0 0 7px rgba(245, 158, 11, 0.35), 0 34px 70px -24px rgba(0, 0, 0, 0.75); }
        .ring { position: absolute; left: 50%; top: calc(var(--ch) / 2 + 26px); width: 0; height: 0; transform-style: preserve-3d; }
        .floor {
            position: absolute; left: 50%; bottom: 14px; width: calc(var(--cw) * 2.5); height: 64px; transform: translateX(-50%);
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.42) 0%, rgba(0, 0, 0, 0.18) 45%, transparent 72%);
            pointer-events: none;
        }

        .pcard {
            position: absolute; left: 0; top: 0;
            width: var(--cw); height: var(--ch);
            margin-left: calc(var(--cw) / -2); margin-top: calc(var(--ch) / -2);
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            will-change: transform, opacity;
        }
        .pc-inner {
            position: relative; width: 100%; height: 100%;
            background: #fff; color: var(--ink);
            border: 10px solid var(--navy-900); border-radius: 24px; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 30px 60px -25px rgba(0, 0, 0, 0.65);
            transition: box-shadow 0.3s, transform 0.28s ease, opacity 0.28s ease;
        }
        .pc-inner::after {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: rgba(0, 27, 53, var(--dim, 0)); transition: background 0.1s;
        }
        .pcard.front .pc-inner { box-shadow: 0 0 0 3px var(--gold), 0 34px 70px -24px rgba(0, 0, 0, 0.75); }
        .pcard.launching .pc-inner { transform: scale(1.07); opacity: 0; }
        .pcard.fresh .pc-inner { animation: freshPop 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
        @keyframes freshPop {
            0% { transform: scale(0.82); box-shadow: 0 0 0 0 var(--gold); }
            55% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0.35); }
            100% { transform: scale(1); }
        }

        .pc-top {
            position: relative; flex: 0 0 45%; padding: 18px;
            display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
            background:
                radial-gradient(240px 170px at 100% 0%, var(--accent-soft), transparent 70%),
                linear-gradient(160deg, var(--navy-800), var(--navy-950));
            border-bottom: 4px solid var(--accent);
        }
        .pc-mark { position: absolute; right: -22px; bottom: -30px; color: #fff; opacity: 0.07; transform: rotate(-12deg); }
        .pc-mark svg { width: 150px; height: 150px; }
        .pc-row { display: flex; justify-content: space-between; align-items: flex-start; position: relative; }
        .pc-tile {
            width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
            background: var(--accent); color: var(--accent-ink);
            box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.14), 0 12px 26px -12px var(--accent);
        }
        .pc-tile svg { width: 32px; height: 32px; }
        .pc-num { font-weight: 800; font-size: 0.72rem; letter-spacing: 0.16em; color: #8ea6bf; padding-top: 4px; }
        .pc-host {
            position: relative; align-self: flex-start; max-width: 100%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            background: rgba(255, 255, 255, 0.1); color: #c6d5e4;
            font-size: 0.74rem; font-weight: 700; padding: 0.3rem 0.65rem; border-radius: 999px;
        }
        .pc-body { flex: 1; min-height: 0; padding: 16px 18px 8px; }
        .pc-body h3 { font-size: 1.25rem; font-weight: 800; color: var(--navy-900); letter-spacing: -0.01em; line-height: 1.2; }
        .pc-body p {
            color: var(--muted); font-size: 0.88rem; line-height: 1.4; margin-top: 0.35rem;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .pc-foot { display: flex; gap: 8px; padding: 0 14px 14px; }
        .pc-open {
            flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
            background: var(--gold); color: var(--navy-950); border: none; border-radius: 12px;
            padding: 0.78rem 1rem; font-weight: 800; font-size: 0.98rem; cursor: pointer;
            box-shadow: 0 8px 18px -8px rgba(245, 158, 11, 0.8);
        }
        .pc-open:hover { background: var(--gold-hi); }
        .pc-edit {
            width: 46px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: #fff;
            color: var(--navy-900); display: grid; place-items: center; cursor: pointer;
        }
        .pc-edit:hover { border-color: var(--navy-800); }

        /* "Add a project" card */
        .pcard.add .pc-inner {
            background: rgba(255, 255, 255, 0.06); color: #fff;
            border: 2.5px dashed rgba(255, 255, 255, 0.38);
            align-items: center; justify-content: center; text-align: center; gap: 0.9rem; padding: 1.5rem;
            box-shadow: none;
        }
        .pcard.add.front .pc-inner { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25); }
        .add-circle {
            width: 76px; height: 76px; border-radius: 22px; background: var(--gold); color: var(--navy-950);
            display: grid; place-items: center; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.14), 0 14px 30px -12px rgba(245, 158, 11, 0.8);
        }
        .add-title { font-size: 1.25rem; font-weight: 800; }
        .add-sub { color: #aebfd1; font-size: 0.88rem; line-height: 1.4; max-width: 15rem; }

        /* ---------- Controls ---------- */
        .controls { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 1rem; }
        .nav-btn {
            width: 48px; height: 48px; border-radius: 14px; border: none; cursor: pointer;
            background: rgba(255, 255, 255, 0.1); color: #fff; display: grid; place-items: center;
            transition: background 0.15s;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.18); }
        .dots { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 60vw; }
        .dot {
            width: 9px; height: 9px; border-radius: 999px; border: none; padding: 0; cursor: pointer;
            background: rgba(255, 255, 255, 0.3); transition: width 0.25s, background 0.25s;
        }
        .dot.on { width: 26px; background: var(--gold); }
        .dot.plus { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.45); }
        .dot.plus.on { background: transparent; box-shadow: inset 0 0 0 2px var(--gold); }
        .hint { text-align: center; color: #8ea6bf; font-size: 0.82rem; margin: 1rem 0 1.6rem; padding: 0 1rem; }
        .hint kbd { font-family: inherit; font-weight: 800; color: #c6d5e4; background: rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 0.05rem 0.4rem; }

        /* ---------- Sheets ---------- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 27, 53, 0.55); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        #editModal { z-index: 1100; }
        .sheet {
            background: #fff; color: var(--ink); border-radius: 22px; width: 94%; max-width: 560px; max-height: 88vh; overflow: auto;
            box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.55); transform: translateY(14px); transition: transform 0.25s;
        }
        .modal-overlay.active .sheet { transform: none; }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
        .sheet-head h3 { font-size: 1.15rem; font-weight: 800; color: var(--navy-900); }
        .sheet-close { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--canvas); cursor: pointer; color: var(--navy-900); display: grid; place-items: center; }
        .sheet-close:hover { background: var(--line-strong); }
        .sheet-body { padding: 1.2rem 1.3rem 1.4rem; }

        .lbl { display: block; font-weight: 800; color: var(--navy-900); font-size: 0.9rem; margin: 1rem 0 0.4rem; }
        .lbl:first-child { margin-top: 0; }
        .lbl span { color: var(--muted); font-weight: 500; }
        .field {
            width: 100%; background: var(--tint); border: 1.5px solid var(--line); border-radius: 13px;
            padding: 0.8rem 0.95rem; font-size: 1rem; color: var(--ink); transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .field:focus { outline: none; border-color: var(--gold); background: #fff; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18); }

        .preview {
            display: flex; align-items: center; gap: 0.9rem; padding: 0.85rem; border-radius: 16px;
            background: linear-gradient(160deg, var(--navy-800), var(--navy-950)); color: #fff; margin-bottom: 0.4rem;
            border-bottom: 4px solid var(--accent);
        }
        .preview .pc-tile { width: 52px; height: 52px; border-radius: 15px; }
        .preview .pc-tile svg { width: 26px; height: 26px; }
        .preview b { display: block; font-size: 1.05rem; }
        .preview small { display: block; color: #aebfd1; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preview > div { min-width: 0; }

        .icon-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; }
        .ico {
            aspect-ratio: 1; border-radius: 11px; border: 1.5px solid var(--line); background: var(--tint);
            color: var(--navy-900); display: grid; place-items: center; cursor: pointer;
        }
        .ico svg { width: 22px; height: 22px; }
        .ico:hover { border-color: var(--line-strong); background: #fff; }
        .ico.on { background: var(--navy-900); border-color: var(--navy-900); color: var(--gold-hi); }
        .swatches { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .sw {
            width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; cursor: pointer;
            box-shadow: 0 0 0 1.5px var(--line-strong); display: grid; place-items: center;
        }
        .sw.on { box-shadow: 0 0 0 3px var(--navy-900); }
        .sw svg { opacity: 0; }
        .sw.on svg { opacity: 1; }

        .form-error { margin-top: 0.8rem; padding: 0.55rem 0.75rem; border-radius: 10px; background: #fef2f2; color: #b91c1c; font-size: 0.88rem; font-weight: 700; }
        .form-error:empty { display: none; }
        .sheet-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 1.3rem; flex-wrap: wrap; }
        .sheet-actions .spacer { flex: 1; }

        .btn-primary {
            background: var(--gold); color: var(--navy-950); border: none; border-radius: 13px; padding: 0.8rem 1.3rem;
            font-weight: 800; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            box-shadow: 0 8px 18px -8px rgba(245, 158, 11, 0.8);
        }
        .btn-primary:hover { background: var(--gold-hi); }
        .btn-primary.block { width: 100%; }
        .btn-secondary {
            background: #fff; border: 1.5px solid var(--line-strong); color: var(--navy-900); border-radius: 12px;
            padding: 0.72rem 1.1rem; font-weight: 700; font-size: 0.95rem; cursor: pointer;
        }
        .btn-secondary:hover { border-color: var(--navy-800); }
        .btn-danger { background: #fff; border: 1.5px solid #fecaca; color: #dc2626; border-radius: 12px; padding: 0.72rem 1.1rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
        .btn-danger:hover { background: #fef2f2; }
        .link-btn { background: none; border: none; color: var(--navy-700); font-weight: 700; font-size: 0.87rem; cursor: pointer; padding: 0.35rem 0.15rem; }
        .link-btn:hover { text-decoration: underline; }

        /* Manage list */
        .mlist { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
        .mrow { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0.75rem; border-top: 1px solid var(--line); }
        .mrow:first-child { border-top: none; }
        .mrow .pc-tile { width: 40px; height: 40px; border-radius: 12px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.14); }
        .mrow .pc-tile svg { width: 20px; height: 20px; }
        .mtext { flex: 1; min-width: 0; }
        .mtext b { display: block; color: var(--navy-900); }
        .mtext small { display: block; color: var(--muted); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mbtns { display: flex; gap: 0.2rem; }
        .mbtn { width: 34px; height: 34px; border-radius: 9px; border: none; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
        .mbtn:hover { background: var(--canvas); color: var(--navy-900); }
        .mbtn.del:hover { background: #fee2e2; color: #dc2626; }
        .mbtn:disabled { opacity: 0.3; cursor: default; background: transparent; }
        .mempty { padding: 1.2rem; text-align: center; color: var(--muted); font-size: 0.9rem; }
        .set-row { display: flex; align-items: center; gap: 0.9rem; margin-top: 1rem; padding: 0.85rem; border-radius: 14px; background: var(--tint); }
        .set-row > div { flex: 1; }
        .set-row b { color: var(--navy-900); }
        .set-row small { display: block; color: var(--muted); font-size: 0.82rem; margin-top: 0.1rem; }
        .switch { position: relative; width: 46px; height: 26px; border: none; border-radius: 999px; background: #cbd5e1; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
        .switch i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.2s, background 0.2s; }
        .switch.on { background: var(--navy-800); }
        .switch.on i { transform: translateX(20px); background: var(--gold); }
        .manage-foot { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }

        /* ---------- Toast ---------- */
        #statusMessageBar {
            position: fixed; left: 50%; bottom: 1.25rem; transform: translate(-50%, 140%); z-index: 3000;
            background: var(--navy-950); color: #fff; padding: 0.75rem 1.15rem; border-radius: 14px; font-weight: 700; font-size: 0.92rem;
            box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.5); max-width: min(92vw, 560px); text-align: center;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.2s, visibility 0.3s;
        }
        #statusMessageBar.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
        #statusMessageBar.success { background: #065f46; }
        #statusMessageBar.error { background: #b91c1c; }

        @media (max-width: 720px) {
            .appbar-inner { padding: 0.55rem 0.9rem; }
            .bar-add span { display: none; }
            .bar-add { padding: 0.55rem 0.65rem; }
            .hero { padding: 1.3rem 1rem 0; }
            .hero h1 { font-size: 1.6rem; }
            .hint .desk { display: none; }
            .modal-overlay { align-items: flex-end; }
            .sheet { width: 100%; max-width: none; border-radius: 22px 22px 0 0; max-height: 92vh; }
            .icon-grid { grid-template-columns: repeat(7, 1fr); gap: 0.3rem; }
        }
        @media (min-width: 721px) { .hint .touch { display: none; } }
        @media (prefers-reduced-motion: reduce) {
            .pc-inner, .pcard.fresh .pc-inner { animation: none; transition: none; }
        }
    </style>
</head>
<body>

<div id="statusMessageBar"></div>

<header class="appbar">
    <div class="appbar-inner">
        <div class="brand">
            <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2" fill="currentColor"/></svg></span>
            <div class="brand-name">Projects<small>Launcher</small></div>
        </div>
        <div class="appbar-actions">
            <button type="button" class="icon-btn" onclick="openManage()" title="Manage projects" aria-label="Manage projects"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg></button>
            <button type="button" class="bar-add" onclick="openEditor(null)" aria-label="Add project"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Add Project</span></button>
        </div>
    </div>
</header>

<section class="hero">
    <div class="eyebrow" id="heroEyebrow">&nbsp;</div>
    <h1 id="heroTitle">&nbsp;</h1>
    <p class="hero-sub" id="heroSub"></p>
</section>

<main>
    <div class="stage" id="stage" tabindex="0" aria-roledescription="carousel" aria-label="Projects">
        <div class="floor"></div>
        <div class="ring" id="ring"></div>
    </div>
    <div class="controls">

<script>
// =====================================================================
// CONFIG
// =====================================================================
const ICONS = {
    checklist: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
    cash: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
    lineup: '<circle cx="4.5" cy="12" r="2"/><path d="M6.5 12H10M10 6v12M10 6h4M10 12h4M10 18h4"/><circle cx="17" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5A6.5 6.5 0 0 1 21.5 20"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    chart: '<path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    box: '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
    cup: '<path d="M6 8h12l-1.4 12.2a2 2 0 0 1-2 1.8H9.4a2 2 0 0 1-2-1.8z"/><path d="M5 8h14M14 8l2-5"/><circle cx="11" cy="14" r="2"/>',
    broom: '<path d="M14 4l6 6M17 7l-6.5 6.5"/><path d="M10.5 13.5L4 20c2 1 6.5 1 9-2.5l-2.5-4z"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/>',
    game: '<rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="18" cy="14" r="1" fill="currentColor"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const ICON_NAMES = {
    checklist: "Checklist", cash: "Money", lineup: "Lineup", users: "People", calendar: "Calendar", chart: "Chart", clock: "Clock",
    box: "Box", cup: "Drink", broom: "Cleaning", star: "Star", game: "Game", globe: "Website", link: "Link"
};
const COLORS = [
    { c: "#f59e0b", ink: "#001b35", name: "Gold" },
    { c: "#ef4444", ink: "#ffffff", name: "Red" },
    { c: "#16a34a", ink: "#ffffff", name: "Green" },
    { c: "#3b82f6", ink: "#ffffff", name: "Blue" },
    { c: "#8b5cf6", ink: "#ffffff", name: "Purple" },
    { c: "#0d9488", ink: "#ffffff", name: "Teal" },
    { c: "#db2777", ink: "#ffffff", name: "Pink" },
    { c: "#c2410c", ink: "#ffffff", name: "Orange" }
];
const DEFAULTS = [
    { id: "checklist", name: "Checklist Tracker", url: "https://spirttomb.github.io/Checklist-Tracker/", desc: "Shift checklists, leader verification and end-of-day logs", icon: "checklist", color: "#f59e0b" },
    { id: "changefund", name: "Change Fund Portal", url: "https://spirttomb.github.io/change-fund-portal/", desc: "Count the change fund and log deposits and received", icon: "cash", color: "#16a34a" },
    { id: "lineup", name: "Lineup Generator", url: "https://spirttomb.github.io/Lineup-Generator/", desc: "Build the shift lineup with breaks, tasks and closing", icon: "lineup", color: "#3b82f6" }
];
const STORE_KEY = "projectLauncher:v1";

// =====================================================================
// HELPERS
// =====================================================================
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function mod(n, m) { return ((n % m) + m) % m; }
function icon(name) { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.link}</svg>`; }
function colorOf(c) { return COLORS.find(x => x.c === c) || COLORS[0]; }
function tint(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`; }
function accentVars(c) { const col = colorOf(c); return `--accent:${col.c};--accent-ink:${col.ink};--accent-soft:${tint(col.c, 0.45)}`; }
function hostPath(url) { try { const u = new URL(url); return (u.hostname + u.pathname).replace(/\/$/, ""); } catch (e) { return url; } }
function newId() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function normUrl(raw) {
    let u = String(raw || "").trim();
    if (!u) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = "https://" + u.replace(/^\/+/, "");
    try {
        const x = new URL(u);
        if (!/^https?:$/.test(x.protocol)) return null;
        if (!x.hostname.includes(".") && x.hostname !== "localhost") return null;
        return x.href;
    } catch (e) { return null; }
}
function showStatusMessage(message, type = "info", duration = 3000) {
    const bar = $("statusMessageBar");
    bar.innerText = message;
    bar.className = type;
    void bar.offsetWidth;
    bar.classList.add("show");
    clearTimeout(window.statusTimeout);
    window.statusTimeout = setTimeout(() => bar.classList.remove("show"), duration);
}
const ICON_OPEN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';
const ICON_PEN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

// =====================================================================
// STORAGE (on this device)
// =====================================================================
function loadStore() {
    try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY));
        if (s && Array.isArray(s.projects)) return { projects: s.projects, newTab: !!s.newTab, last: s.last || null };
    } catch (e) {}
    return { projects: DEFAULTS.map(p => ({ ...p })), newTab: false, last: null };
}
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
let store = loadStore();

// =====================================================================
// CAROUSEL
// =====================================================================
const stage = $("stage"), ring = $("ring");
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let items = [], cards = [];
let pos = 0, target = 0, raf = null, dragging = false, drag = null;
let CW = 280, CH = 364, R = 390, STEP = 34;
let lastFront = -1, freshId = null;

function sizes() {
    const vw = window.innerWidth, vh = window.innerHeight;
    CW = Math.round(Math.min(300, Math.max(220, vw * 0.64)));
    CH = Math.round(CW * 1.3);
    if (vh < 760) CH = Math.max(300, Math.min(CH, vh - 330));
    R = CW * 1.85;
    document.documentElement.style.setProperty("--cw", CW + "px");
    document.documentElement.style.setProperty("--ch", CH + "px");
}

function cardHtml(p, i) {
    return `<div class="pcard${p.id === freshId ? " fresh" : ""}" data-i="${i}" style="${accentVars(p.color)}">
        <div class="pc-inner">
            <div class="pc-top">
                <span class="pc-mark">${icon(p.icon)}</span>
                <div class="pc-row"><span class="pc-tile">${icon(p.icon)}</span><span class="pc-num">${String(i + 1).padStart(2, "0")}</span></div>
                <span class="pc-host">${esc(hostPath(p.url))}</span>
            </div>
            <div class="pc-body"><h3>${esc(p.name)}</h3>${p.desc ? `<p>${esc(p.desc)}</p>` : ""}</div>
            <div class="pc-foot">
                <button type="button" class="pc-open" data-act="open" tabindex="-1">${ICON_OPEN} Open</button>
                <button type="button" class="pc-edit" data-act="edit" tabindex="-1" aria-label="Edit ${esc(p.name)}">${ICON_PEN}</button>
            </div>
        </div>
    </div>`;
}
function addCardHtml(i) {
    return `<div class="pcard add" data-i="${i}">
        <div class="pc-inner">
            <span class="add-circle"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
            <div class="add-title">Add a project</div>
            <div class="add-sub">Any link: a GitHub page, a sheet, a form</div>
            <button type="button" class="sr-only" data-act="open" tabindex="-1">Add a project</button>
        </div>
    </div>`;
}

function renderRing() {
    items = store.projects.map(p => ({ p })).concat([{ add: true }]);
    ring.innerHTML = items.map((it, i) => it.add ? addCardHtml(i) : cardHtml(it.p, i)).join("");
    cards = Array.from(ring.children);
    $("dots").innerHTML = items.map((it, i) =>
        `<button type="button" class="dot${it.add ? " plus" : ""}" data-i="${i}" aria-label="${it.add ? "Add a project" : esc(it.p.name)}"></button>`).join("");
    if (freshId) {
        const f = freshId;
        setTimeout(() => { if (freshId === f) freshId = null; cards.forEach(c => c.classList.remove("fresh")); }, 950);
    }
    lastFront = -1;
    updateHero();
}

function rebuild(frontIndex) {
    renderRing();
    pos = target = mod(frontIndex, items.length);
    layout();
}

function frontIndex() { return mod(Math.round(target), items.length); }

function layout() {
    const N = cards.length;
    if (!N) return;
    const fi = mod(Math.round(pos), N);
    cards.forEach((el, i) => {
        let d = mod(i - pos, N);
        if (d >= N / 2) d -= N;
        if (N === 1) d = 0;
        const ad = Math.abs(d);
        let vis = Math.min(1, (3.1 - ad) * 1.6);
        if (N <= 6 && N > 1) vis = Math.min(vis, (N / 2 - ad) * 3);
        vis = Math.max(0, vis);
        el.style.transform = `translateZ(${-R}px) rotateY(${(d * STEP).toFixed(3)}deg) translateZ(${R}px)`;
        el.style.opacity = vis.toFixed(3);
        el.style.zIndex = String(1000 - Math.round(ad * 100));
        el.style.pointerEvents = vis > 0.15 ? "auto" : "none";
        el.style.visibility = vis < 0.01 ? "hidden" : "visible";
        el.style.setProperty("--dim", (Math.min(1, ad) * 0.42).toFixed(3));
        el.classList.toggle("front", i === fi && ad < 0.5);
    });
    updateFront(frontIndex());
}

function updateFront(fi) {
    if (fi === lastFront) return;
    lastFront = fi;
    document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("on", i === fi));
    cards.forEach((c, i) => c.querySelectorAll("button").forEach(b => { b.tabIndex = i === fi ? 0 : -1; }));
    const it = items[fi];
    $("liveRegion").textContent = it ? (it.add ? "Add a project" : `${it.p.name}, ${fi + 1} of ${store.projects.length}`) : "";
}

function tick() {
    raf = null;
    if (!dragging) {
        pos += (target - pos) * (reduceMotion ? 0.5 : 0.14);
        if (Math.abs(target - pos) < 0.001) pos = target;
    }
    layout();
    if (dragging || pos !== target) raf = requestAnimationFrame(tick);
    else settled();
}
function kick() { if (!raf) raf = requestAnimationFrame(tick); }
function settled() {
    const it = items[frontIndex()];
    if (it && it.p && store.last !== it.p.id) { store.last = it.p.id; saveStore(); }
}
function step(n) { target = Math.round(target) + n; kick(); }
function goTo(i) {
    const N = items.length;
    let diff = i - frontIndex();
    if (diff > N / 2) diff -= N;
    if (diff < -N / 2) diff += N;
    target = Math.round(target) + diff;
    kick();
}

function activate(i) {
    const it = items[i];
    if (!it) return;
    if (it.add) { openEditor(null); return; }
    launch(it.p, cards[i]);
}
function launch(p, card) {
    if (store.newTab) {
        const w = window.open(p.url, "_blank", "noopener");
        if (!w) location.href = p.url;
        return;
    }
    if (card && !reduceMotion) {
        card.classList.add("launching");
        setTimeout(() => { location.href = p.url; }, 260);
    } else location.href = p.url;
}
window.addEventListener("pageshow", () => cards.forEach(c => c.classList.remove("launching")));

function handleTap(card, act) {
    if (!card) return;
    const i = +card.dataset.i;
    const settledEnough = Math.abs(target - pos) < 0.3;
    if (i === frontIndex() && settledEnough) {
        if (act && act.dataset.act === "edit" && items[i].p) openEditor(items[i].p.id);
        else activate(i);
    } else goTo(i);
}

// Drag / swipe
stage.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, start: pos, lastX: e.clientX, lastT: performance.now(), v: 0, moved: false,
        card: e.target.closest(".pcard"), act: e.target.closest("[data-act]"), id: e.pointerId };
});
stage.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved) {
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
            drag.moved = true;
            dragging = true;
            drag.start = pos;
            drag.x = e.clientX;
            try { stage.setPointerCapture(drag.id); } catch (err) {}
            stage.classList.add("dragging");
        } else if (Math.abs(dy) > 12) { drag = null; return; }
        else return;
    }
    const px = CW * 0.85;
    pos = drag.start - (e.clientX - drag.x) / px;
    target = pos;
    const now = performance.now(), dt = now - drag.lastT;
    if (dt > 0) drag.v = 0.75 * drag.v + 0.25 * ((e.clientX - drag.lastX) / dt);
    drag.lastX = e.clientX;
    drag.lastT = now;
    kick();
});
function endDrag(e, cancelled) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const d = drag;
    drag = null;
    if (d.moved) {
        dragging = false;
        stage.classList.remove("dragging");
        const fling = Math.max(-4, Math.min(4, -d.v * 220 / (CW * 0.85)));
        target = Math.round(pos + fling);
        kick();
    } else if (!cancelled) handleTap(d.card, d.act);
}
stage.addEventListener("pointerup", e => endDrag(e, false));
stage.addEventListener("pointercancel", e => endDrag(e, true));
// Keyboard "clicks" on the front card's buttons (mouse/touch go through pointerup)
ring.addEventListener("click", e => {
    if (e.detail !== 0) return;
    handleTap(e.target.closest(".pcard"), e.target.closest("[data-act]"));
});
$("dots").addEventListener("click", e => { const d = e.target.closest(".dot"); if (d) goTo(+d.dataset.i); });

// Mouse wheel / trackpad
let wheelAcc = 0, wheelLock = 0;
stage.addEventListener("wheel", e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    e.preventDefault();
    const now = performance.now();
    if (now < wheelLock) return;
    wheelAcc += d;
    if (Math.abs(wheelAcc) > 40) { step(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; wheelLock = now + 240; }
}, { passive: false });

// Keyboard
document.addEventListener("keydown", e => {
    const open = document.querySelector(".modal-overlay.active");
    if (open) {
        if (e.key === "Escape") closeModal(open.id);
        if (e.key === "Enter" && open.id === "editModal" && e.target.tagName === "INPUT") { e.preventDefault(); saveEditor(); }
        return;
    }
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if ((e.key === "Enter" || e.key === " ") && tag !== "BUTTON") { e.preventDefault(); activate(frontIndex()); }
});

window.addEventListener("resize", () => { sizes(); layout(); });

// =====================================================================
// HERO
// =====================================================================
function updateHero() {
    const d = new Date(), h = d.getHours();
    $("heroEyebrow").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    $("heroTitle").textContent = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    const n = store.projects.length;
    $("heroSub").textContent = n ? `${n} project${n === 1 ? "" : "s"} · pick one to open` : "No projects yet · add your first one";
}

// =====================================================================
// MODALS
// =====================================================================
function openModal(id) { $(id).classList.add("active"); }
function closeModal(id) {
    $(id).classList.remove("active");
    if (!document.querySelector(".modal-overlay.active")) stage.focus({ preventScroll: true });
}

// ---------- Add / edit ----------
let ed = null;
function pickColor() {
    const used = new Set(store.projects.map(p => p.color));
    return (COLORS.find(c => !used.has(c.c)) || COLORS[store.projects.length % COLORS.length]).c;
}
function openEditor(id) {
    const p = id ? store.projects.find(x => x.id === id) : null;
    ed = { id: p ? p.id : null, icon: p ? p.icon : "link", color: p ? p.color : pickColor() };
    $("edTitle").textContent = p ? "Edit Project" : "Add Project";
    $("fName").value = p ? p.name : "";
    $("fUrl").value = p ? p.url : "";
    $("fDesc").value = p ? (p.desc || "") : "";
    $("fDelete").style.display = p ? "" : "none";
    $("fSave").textContent = p ? "Save" : "Add Project";
    $("fErr").textContent = "";
    renderPickers();
    renderPreview();
    openModal("editModal");
    if (!p && window.matchMedia("(hover: hover)").matches) setTimeout(() => $("fName").focus(), 80);
}
function renderPickers() {
    $("fIcons").innerHTML = Object.keys(ICONS).map(k =>
        `<button type="button" class="ico${k === ed.icon ? " on" : ""}" data-icon="${k}" title="${ICON_NAMES[k]}" aria-label="${ICON_NAMES[k]} icon">${icon(k)}</button>`).join("");
    $("fColors").innerHTML = COLORS.map(c =>
        `<button type="button" class="sw${c.c === ed.color ? " on" : ""}" data-color="${c.c}" style="background:${c.c}" aria-label="${c.name}">${ICON_CHECK}</button>`).join("");
}
$("fIcons").addEventListener("click", e => { const b = e.target.closest(".ico"); if (!b) return; ed.icon = b.dataset.icon; renderPickers(); renderPreview(); });
$("fColors").addEventListener("click", e => { const b = e.target.closest(".sw"); if (!b) return; ed.color = b.dataset.color; renderPickers(); renderPreview(); });
function renderPreview() {
    if (!ed) return;
    const name = $("fName").value.trim() || "Project name";
    const url = normUrl($("fUrl").value);
    const el = $("edPreview");
    el.setAttribute("style", accentVars(ed.color));
    el.innerHTML = `<span class="pc-tile">${icon(ed.icon)}</span><div><b>${esc(name)}</b><small>${esc(url ? hostPath(url) : "Paste the link below")}</small></div>`;
}
function saveEditor() {
    const name = $("fName").value.trim();
    const url = normUrl($("fUrl").value);
    const desc = $("fDesc").value.trim();
    if (!name) { $("fErr").textContent = "Give the project a name."; $("fName").focus(); return; }
    if (!url) { $("fErr").textContent = "That link doesn't look right. Try something like spirttomb.github.io/My-Project/"; $("fUrl").focus(); return; }
    const before = frontIndex();
    if (ed.id) {
        const p = store.projects.find(x => x.id === ed.id);
        if (p) Object.assign(p, { name, url, desc, icon: ed.icon, color: ed.color });
        saveStore();
        rebuild(before);
        showStatusMessage(`Saved ${name}.`, "success");
    } else {
        const p = { id: newId(), name, url, desc, icon: ed.icon, color: ed.color };
        store.projects.push(p);
        store.last = p.id;
        saveStore();
        freshId = p.id;
        rebuild(before);
        goTo(store.projects.length - 1);
        showStatusMessage(`Added ${name}.`, "success");
    }
    closeModal("editModal");
    if ($("manageModal").classList.contains("active")) renderManage();
}
function deleteEditing() {
    if (!ed || !ed.id) return;
    const i = store.projects.findIndex(x => x.id === ed.id);
    if (i < 0) return;
    if (!confirm(`Remove ${store.projects[i].name} from your projects?`)) return;
    const name = store.projects[i].name;
    store.projects.splice(i, 1);
    saveStore();
    rebuild(i);
    closeModal("editModal");
    if ($("manageModal").classList.contains("active")) renderManage();
    showStatusMessage(`Removed ${name}.`, "success");
}

// ---------- Manage ----------
function openManage() { renderManage(); openModal("manageModal"); }
function renderManage() {
    const ps = store.projects;
    const missing = DEFAULTS.filter(d => !ps.some(p => p.id === d.id));
    $("manageBody").innerHTML = `
        <div class="mlist">${ps.length ? ps.map((p, i) => `
            <div class="mrow">
                <span class="pc-tile" style="${accentVars(p.color)}">${icon(p.icon)}</span>
                <div class="mtext"><b>${esc(p.name)}</b><small>${esc(hostPath(p.url))}</small></div>
                <div class="mbtns">
                    <button type="button" class="mbtn" onclick="moveProject(${i}, -1)" ${i === 0 ? "disabled" : ""} aria-label="Move up"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
                    <button type="button" class="mbtn" onclick="moveProject(${i}, 1)" ${i === ps.length - 1 ? "disabled" : ""} aria-label="Move down"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
                    <button type="button" class="mbtn" data-id="${esc(p.id)}" onclick="openEditor(this.dataset.id)" aria-label="Edit">${ICON_PEN}</button>
                    <button type="button" class="mbtn del" onclick="removeProject(${i})" aria-label="Remove"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                </div>
            </div>`).join("") : `<div class="mempty">No projects yet.</div>`}
        </div>
        <div class="set-row">
            <div><b>Open in a new tab</b><small>Keep this launcher open behind your project</small></div>
            <button type="button" class="switch ${store.newTab ? "on" : ""}" onclick="toggleNewTab()" aria-label="Open in a new tab"><i></i></button>
        </div>
        <div class="manage-foot">
            <button type="button" class="btn-primary block" onclick="openEditor(null)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add Project</button>
            ${missing.length ? `<button type="button" class="link-btn" onclick="restoreDefaults()">Restore ${missing.map(d => d.name).join(", ")}</button>` : ""}
        </div>`;
}
function moveProject(i, dir) {
    const j = i + dir, ps = store.projects;
    if (j < 0 || j >= ps.length) return;
    const frontItem = items[frontIndex()];
    [ps[i], ps[j]] = [ps[j], ps[i]];
    saveStore();
    const keep = frontItem && frontItem.p ? ps.findIndex(p => p.id === frontItem.p.id) : ps.length;
    rebuild(keep);
    renderManage();
}
function removeProject(i) {
    const p = store.projects[i];
    if (!p || !confirm(`Remove ${p.name} from your projects?`)) return;
    store.projects.splice(i, 1);
    saveStore();
    rebuild(Math.min(frontIndex(), store.projects.length));
    renderManage();
    showStatusMessage(`Removed ${p.name}.`, "success");
}
function restoreDefaults() {
    DEFAULTS.forEach(d => { if (!store.projects.some(p => p.id === d.id)) store.projects.push({ ...d }); });
    saveStore();
    rebuild(frontIndex());
    renderManage();
    showStatusMessage("Restored.", "success");
}
function toggleNewTab() { store.newTab = !store.newTab; saveStore(); renderManage(); }

// =====================================================================
// START
// =====================================================================
sizes();
renderRing();
const startAt = Math.max(0, store.projects.findIndex(p => p.id === store.last));
pos = target = startAt;
layout();
stage.focus({ preventScroll: true });
</script>
</body>
</html>
